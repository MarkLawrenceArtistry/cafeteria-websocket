<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BytesCafe Login</title>
    <!-- LOCAL ASSETS -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <style>
        body { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; border-radius: 20px; }
    </style>
</head>
<body>
    <div class="container px-3">
        <div class="card login-card shadow-lg border-0 mx-auto">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-primary">BytesCafe</h3>
                    <p class="text-muted">Sign in to continue</p>
                </div>
                
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">USERNAME</label>
                        <input type="text" id="username" class="form-control form-control-lg bg-light border-0" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">PASSWORD</label>
                        <input type="password" id="password" class="form-control form-control-lg bg-light border-0" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg rounded-3 mb-3">Login</button>
                </form>

                <div id="error-msg" class="alert alert-danger d-none text-center"></div>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
