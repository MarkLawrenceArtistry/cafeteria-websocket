<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Critical for Mobile -->
    <title>Cashier POS</title>
    
    <!-- LOCAL ASSETS -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    
    <script src="auth.js"></script>
    <script src="assets/js/jspdf.umd.min.js"></script>
    
    <style>
        /* POS SPECIFIC STYLES */
        body { overflow: hidden; /* Prevent body scroll, handle internally */ }
        
        /* Layout Grid */
        .pos-container { display: flex; height: 100vh; flex-direction: column; }
        
        /* Category Nav - Responsive */
        .category-nav {
            background: white; border-bottom: 1px solid #eee; padding: 10px;
            display: flex; gap: 10px; overflow-x: auto; white-space: nowrap;
        }
        
        /* Desktop Layout Override */
        @media (min-width: 992px) {
            .pos-container { flex-direction: row; }
            .category-nav {
                flex-direction: column; width: 80px; border-right: 1px solid #eee; 
                border-bottom: none; height: 100vh; padding-top: 20px; align-items: center;
            }
        }

        .nav-icon {
            width: 50px; height: 50px; min-width: 50px; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center;
            color: #808191; font-size: 1.5rem; transition: 0.3s; cursor: pointer;
        }
        .nav-icon.active, .nav-icon:hover { 
            background-color: var(--primary-color); color: white; 
        }

        /* Main Area */
        .main-area { flex: 1; padding: 20px; overflow-y: auto; background: var(--bg-color); }

        /* Product Card */
        .product-card {
            background: white; border-radius: 16px; border: none; cursor: pointer; transition: 0.2s;
        }
        .product-card:active { transform: scale(0.98); }
        .product-img-placeholder { 
            height: 100px; background: #e9ecef; display: flex; 
            align-items: center; justify-content: center; color: #adb5bd; 
        }

        /* Cart - Desktop: Fixed Right / Mobile: Offcanvas */
        .cart-section {
            background: white; border-left: 1px solid #eee; display: flex; flex-direction: column;
        }
        @media (min-width: 992px) {
            .cart-section { width: 350px; height: 100vh; }
        }
        
        /* Mobile Cart Floating Button (Visible only on mobile) */
        .fab-cart {
            position: fixed; bottom: 20px; right: 20px; 
            background: var(--primary-color); color: white;
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(108, 93, 211, 0.4);
            z-index: 1000; font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="pos-container">
        
        <!-- MOBILE HEADER (Visible < 992px) -->
        <div class="d-lg-none bg-white p-3 d-flex justify-content-between align-items-center border-bottom">
            <h5 class="m-0 fw-bold text-primary">BytesCafe</h5>
            <button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i></button>
        </div>

        <!-- NAVIGATION (Categories) -->
        <div class="category-nav scroll-hide">
            <div class="nav-icon active" onclick="filterCategory('')" title="All"><i class="bi bi-grid-fill"></i></div>
            <div class="nav-icon" onclick="filterCategory('Food')" title="Food"><i class="bi bi-egg-fried"></i></div>
            <div class="nav-icon" onclick="filterCategory('Drink')" title="Drinks"><i class="bi bi-cup-straw"></i></div>
            <div class="nav-icon" onclick="filterCategory('Snack')" title="Snacks"><i class="bi bi-cookie"></i></div>
            
            <!-- Desktop Logout -->
            <div class="mt-auto mb-3 nav-icon text-danger d-none d-lg-flex" onclick="logout()"><i class="bi bi-box-arrow-right"></i></div>
        </div>

        <!-- MAIN PRODUCT AREA -->
        <div class="main-area">
            <h4 class="fw-bold mb-3">Menu</h4>
            <div id="product-list" class="row g-2 g-md-3">
                <!-- Products injected by JS -->
            </div>
            <!-- Spacer for mobile FAB -->
            <div class="d-lg-none" style="height: 80px;"></div>
        </div>

        <!-- CART SECTION (Offcanvas on Mobile, Static on Desktop) -->
        <!-- We use standard bootstrap offcanvas classes but force it to be always shown on desktop via custom CSS/structure -->
        
        <!-- Mobile Trigger Button -->
        <div class="fab-cart d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
            <i class="bi bi-basket2"></i>
        </div>

        <!-- Cart Container -->
        <div class="offcanvas-lg offcanvas-end cart-section" tabindex="-1" id="cartOffcanvas">
            <div class="offcanvas-header border-bottom">
                <h5 class="offcanvas-title fw-bold">Current Order</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#cartOffcanvas"></button>
            </div>
            
            <!-- Desktop Header equivalent -->
            <div class="p-3 border-bottom d-none d-lg-block">
                <h4 class="fw-bold m-0">Current Order</h4>
            </div>

            <div class="p-3 bg-light">
                 <input type="text" id="customerName" class="form-control border-0" placeholder="Customer Name (Optional)">
            </div>
            
            <div class="flex-grow-1 overflow-auto p-3" id="cart-items">
                <!-- Cart Items -->
            </div>

            <div class="p-3 bg-light border-top">
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Total</span>
                    <span class="fw-bold fs-4" id="cart-total">$0.00</span>
                </div>
                <button id="btn-checkout" class="btn btn-primary w-100 py-3 fw-bold rounded-3" disabled>
                    Charge Payment
                </button>
            </div>
        </div>

    </div>

    <!-- RECEIPT MODAL -->
    <div class="modal fade" id="receiptModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body p-4" id="printable-receipt">
                    <div class="text-center mb-3">
                        <h4 class="fw-bold">BytesCafe</h4>
                        <p class="text-muted mb-0">Receipt</p>
                        <small id="receipt-date"></small>
                    </div>
                    <hr class="border-dashed">
                    <div id="receipt-items-list" class="mb-3"></div>
                    <hr>
                    <div class="d-flex justify-content-between fw-bold fs-5">
                        <span>Total</span>
                        <span id="receipt-total-disp">$0.00</span>
                    </div>
                    <div class="text-center mt-4">
                        <small class="text-muted">Customer: <span id="receipt-customer"></span></small><br>
                        <strong>Thank You!</strong>
                    </div>
                </div>
                <div class="modal-footer border-0 justify-content-center">
                    <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-outline-primary rounded-pill px-4" onclick="downloadReceiptPDF()">PDF</button>
                    <!-- Note: Window.print might not work well on mobile without specific CSS, prefer PDF -->
                </div>
            </div>
        </div>
    </div>

    <!-- LOCAL SCRIPTS -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        function logout() { sessionStorage.removeItem('user'); window.location.href = 'login.html'; }
        
        function filterCategory(cat) {
            // Update UI Active State
            document.querySelectorAll('.nav-icon').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const cards = document.querySelectorAll('.col-product');
            cards.forEach(card => {
                if (card.dataset.cat === cat || !cat) card.style.display = 'block';
                else card.style.display = 'none';
            });
        }
    </script>
</body>
</html>
